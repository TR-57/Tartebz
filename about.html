<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>من نحن | ترتيبز</title>
  <meta name="description" content="قصة ترتيبز: من مبادرة منزلية في البحرين إلى علامة حلويات معروفة.">
  <meta name="theme-color" content="#E30613">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>(function(){try{var l=new URLSearchParams(location.search).get('lang')||JSON.parse(localStorage.getItem('tz_lang')||'"ar"');if(l==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';}}catch(e){}})();</script>
</head>
<body data-page="about" data-title="nav_about" class="has-hero">
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero">
      <div class="hero-decor" aria-hidden="true"><span class="deco deco-1"></span><span class="deco deco-2"></span></div>
      <div class="container page-hero-inner">
        <nav class="crumbs" aria-label="breadcrumb"><a data-href="index.html" href="index.html" data-i18n="home"></a><span class="flip-rtl" data-icon="chevron"></span><span data-i18n="nav_about"></span></nav>
        <h1 data-i18n="about_title"></h1>
        <p data-i18n="story_title"></p>
      </div>
      <svg class="hero-wave" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 Q 360 0 720 30 T 1440 30 V60 H0Z"/></svg>
    </section>
    <section class="section">
      <div class="container about-intro">
        <div class="reveal">
          <span class="kicker"><span data-icon="flag"></span><span data-i18n="story_kicker"></span></span>
          <p data-i18n="about_text"></p>
          <div class="about-stats">
            <div><b data-count="2000" data-prefix="+">+2000</b><span data-i18n="stat_sold"></span></div>
            <div><b data-count="6" data-prefix="">6</b><span data-i18n="stat_countries"></span></div>
            <div><b data-count="11" data-prefix="">11</b><span data-i18n="nav_shop"></span></div>
          </div>
        </div>
        <div class="story-visual reveal" style="--d:120ms">
          <div class="story-collage" aria-hidden="true">
            <div class="sc sc-1" data-art="sweet-sour-strips"></div>
            <div class="sc sc-3" data-art="marshmallow-red-berry"></div>
            <div class="sc sc-2" data-art="gharqana-electric-red-berry"></div>
          </div>
          <div class="float-card"><span class="fc-ico" data-icon="leaf"></span><span><span class="big" data-i18n="float_big"></span><span class="small" data-i18n="float_small"></span></span></div>
        </div>
      </div>
    </section>

    <section class="section section-cream" aria-labelledby="values-h">
      <div class="container">
        <div class="section-head reveal"><span class="kicker"><span data-icon="heart"></span><span data-i18n="values_kicker"></span></span><h2 id="values-h" data-i18n="values_title"></h2></div>
        <div class="values-grid">
          <div class="value-card reveal" style="--d:0ms"><div class="why-ico" data-icon="flag"></div><h3 data-i18n="val_1_t"></h3><p data-i18n="val_1"></p></div>
          <div class="value-card reveal" style="--d:80ms"><div class="why-ico" data-icon="idea"></div><h3 data-i18n="val_2_t"></h3><p data-i18n="val_2"></p></div>
          <div class="value-card reveal" style="--d:160ms"><div class="why-ico" data-icon="award"></div><h3 data-i18n="val_3_t"></h3><p data-i18n="val_3"></p></div>
          <div class="value-card reveal" style="--d:240ms"><div class="why-ico" data-icon="heart"></div><h3 data-i18n="val_4_t"></h3><p data-i18n="val_4"></p></div>
          <div class="value-card reveal" style="--d:320ms"><div class="why-ico" data-icon="people"></div><h3 data-i18n="val_5_t"></h3><p data-i18n="val_5"></p></div>
        </div>
      </div>
    </section>

    <section class="section" aria-labelledby="founding-h">
      <div class="container story-grid">
        <div class="story-copy reveal">
          <span class="kicker"><span data-icon="sparkle"></span><span data-i18n="story_kicker"></span></span>
          <h2 id="founding-h" data-i18n="founding_title"></h2>
          <p data-i18n="founding_1"></p>
          <p data-i18n="founding_2"></p>
          <a class="btn btn-primary btn-lg" data-href="shop.html" href="shop.html"><span data-i18n="order_now"></span><span class="flip-rtl" data-icon="arrow"></span></a>
        </div>
        <div class="story-visual reveal" style="--d:120ms">
          <div class="story-collage" aria-hidden="true">
            <div class="sc sc-1" data-art="tartebz-fruits-berry"></div>
            <div class="sc sc-3" data-art="tartebz-fruits-mango"></div>
            <div class="sc sc-2" data-art="electric-sour-strips"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section section-dark" aria-labelledby="media-h">
      <div class="container">
        <div class="section-head reveal"><span class="kicker"><span data-icon="award"></span><span data-i18n="press_title"></span></span><h2 id="media-h" data-i18n="media_title"></h2></div>
        <div class="media-grid">
          <div class="media-card reveal"><div class="why-ico" data-icon="doc"></div><p data-i18n="media_1"></p></div>
          <div class="media-card reveal" style="--d:100ms"><div class="why-ico" data-icon="people"></div><p data-i18n="media_2"></p></div>
          <div class="media-card reveal" style="--d:200ms"><div class="why-ico" data-icon="flag"></div><p data-i18n="media_3"></p></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/art.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/pages.js" defer></script>
</body>
</html>
