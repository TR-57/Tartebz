<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ترتيبز | قمر الدين الأصلي</title>
  <meta name="description" content="ترتيبز: حلويات قمر الدين الحامض والحلو بنكهات استوائية جريئة، من البحرين إلى كل دول الخليج.">
  <meta name="theme-color" content="#E30613">
  <meta property="og:title" content="ترتيبز | قمر الدين الأصلي">
  <meta property="og:description" content="حامض حلو أو حامض كهرباء… اختر حموضتك.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>(function(){try{var l=new URLSearchParams(location.search).get('lang')||JSON.parse(localStorage.getItem('tz_lang')||'"ar"');if(l==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';}}catch(e){}})();</script>
</head>
<body data-page="home" class="has-hero">
  <div id="site-header"></div>

  <main id="main">
    <!-- HERO -->
    <section class="hero" aria-labelledby="hero-h1">
      <div class="hero-decor" aria-hidden="true"><span class="deco deco-1"></span><span class="deco deco-2"></span><span class="deco deco-3"></span></div>
      <div class="hero-icons" aria-hidden="true">
        <span class="hi i1" data-icon="sparkle"></span><span class="hi i2" data-icon="star"></span>
        <span class="hi i3" data-icon="sparkle"></span><span class="hi i4" data-icon="bolt"></span><span class="hi i5" data-icon="sparkle"></span>
      </div>
      <div class="container hero-grid">
        <div class="hero-copy">
          <span class="hero-badge"><span class="dot" data-icon="sparkle"></span><span data-i18n="hero_badge"></span></span>
          <h1 id="hero-h1" data-i18n-html="hero_title"></h1>
          <p class="hero-text" data-i18n="hero_text"></p>
          <div class="hero-ctas">
            <a class="btn btn-yellow btn-lg" data-href="shop.html" href="shop.html"><span data-i18n="hero_cta"></span></a>
            <a class="btn btn-ghost btn-lg" data-href="about.html" href="about.html"><span data-i18n="hero_cta2"></span></a>
          </div>
          <ul class="hero-stats" id="hero-stats"></ul>
        </div>
        <div class="hero-visual" aria-hidden="true">
          <div class="hero-ring"></div>
          <div class="hero-logo" id="hero-logo"></div>
          <div class="hero-pack hero-pack-1" id="hero-pack-1"></div>
          <div class="hero-pack hero-pack-2" id="hero-pack-2"></div>
        </div>
      </div>
      <a class="scroll-cue" href="#cats"><span class="mouse"></span><span data-i18n="scroll"></span></a>
      <svg class="hero-wave" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 C 240 90 480 0 720 30 S 1200 80 1440 30 V80 H0Z"/></svg>
    </section>

    <div class="marquee" id="marquee" aria-hidden="true"></div>

    <!-- CATEGORIES -->
    <section class="section" id="cats" aria-labelledby="cats-h">
      <div class="container">
        <div class="section-head reveal">
          <span class="kicker"><span data-icon="bolt"></span><span data-i18n="cats_kicker"></span></span>
          <h2 id="cats-h" data-i18n="cats_title"></h2>
        </div>
        <div class="cat-grid" id="cat-grid"></div>
      </div>
    </section>

    <!-- BEST SELLERS -->
    <section class="section section-cream" aria-labelledby="bs-h">
      <div class="container">
        <div class="section-head reveal">
          <span class="kicker"><span data-icon="star"></span><span data-i18n="bs_kicker"></span></span>
          <h2 id="bs-h" data-i18n="bs_title"></h2>
        </div>
        <div class="grid products-grid" id="bs-grid"></div>
        <div class="section-foot reveal"><a class="btn btn-primary btn-lg" data-href="shop.html" href="shop.html"><span data-i18n="view_all"></span><span class="flip-rtl" data-icon="arrow"></span></a></div>
      </div>
    </section>

    <!-- WHY US -->
    <section class="section" aria-labelledby="why-h">
      <div class="container">
        <div class="section-head reveal">
          <span class="kicker"><span data-icon="heart"></span><span data-i18n="why_kicker"></span></span>
          <h2 id="why-h" data-i18n="why_title"></h2>
        </div>
        <div class="why-grid">
          <div class="why-card reveal" style="--d:0ms"><div class="why-ico" data-icon="award"></div><h3 data-i18n="why_1_t"></h3><p data-i18n="why_1"></p></div>
          <div class="why-card reveal" style="--d:90ms"><div class="why-ico" data-icon="gift"></div><h3 data-i18n="why_2_t"></h3><p data-i18n="why_2"></p></div>
          <div class="why-card reveal" style="--d:180ms"><div class="why-ico" data-icon="shield"></div><h3 data-i18n="why_3_t"></h3><p data-i18n="why_3"></p></div>
          <div class="why-card reveal" style="--d:270ms"><div class="why-ico" data-icon="sparkle"></div><h3 data-i18n="why_4_t"></h3><p data-i18n="why_4"></p></div>
        </div>
        <ul class="channels">
          <li class="reveal"><span data-icon="card"></span><span data-i18n="ch_1"></span></li>
          <li class="reveal" style="--d:90ms"><span data-icon="cake"></span><span data-i18n="ch_2"></span></li>
          <li class="reveal" style="--d:180ms"><span data-icon="store"></span><span data-i18n="ch_3"></span></li>
        </ul>
      </div>
    </section>

    <!-- STORY -->
    <section class="section section-cream" aria-labelledby="story-h">
      <div class="container story-grid">
        <div class="story-visual reveal">
          <div class="story-collage" aria-hidden="true">
            <div class="sc sc-1" data-art="tartebz-fruits"></div>
            <div class="sc sc-3" data-art="tartebz-fruits-pineapple"></div>
            <div class="sc sc-2" data-art="marshmallow-blueberry"></div>
          </div>
          <div class="float-card">
            <span class="fc-ico" data-icon="leaf"></span>
            <span><span class="big" data-i18n="float_big"></span><span class="small" data-i18n="float_small"></span></span>
          </div>
        </div>
        <div class="story-copy reveal" style="--d:120ms">
          <span class="kicker"><span data-icon="flag"></span><span data-i18n="story_kicker"></span></span>
          <h2 id="story-h" data-i18n="story_title"></h2>
          <p data-i18n="story_text"></p>
          <a class="btn btn-primary btn-lg" data-href="about.html" href="about.html"><span data-i18n="story_cta"></span><span class="flip-rtl" data-icon="arrow"></span></a>
        </div>
      </div>
    </section>

    <!-- SHIPPING -->
    <section class="section section-dark" aria-labelledby="ship-h">
      <div class="container ship-band">
        <div class="reveal">
          <div class="ship-truck" data-icon="truck"></div>
          <span class="kicker"><span data-icon="pin"></span><span data-i18n="ship_kicker"></span></span>
          <h2 id="ship-h" data-i18n="ship_title"></h2>
          <p data-i18n="ship_text"></p>
        </div>
        <ul class="ship-list" id="ship-list"></ul>
      </div>
    </section>

    <!-- PRESS -->
    <section class="section" aria-labelledby="press-h">
      <div class="container">
        <div class="section-head reveal"><h2 id="press-h" data-i18n="press_title"></h2></div>
        <div class="press-row reveal">
          <span class="press-item"><span data-icon="doc"></span><span data-i18n="press_1"></span></span>
          <span class="press-item"><span data-icon="award"></span><span data-i18n="press_2"></span></span>
          <span class="press-item"><span data-icon="flag"></span><span data-i18n="press_3"></span></span>
        </div>
      </div>
    </section>

    <!-- CTA -->
    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="cta-band reveal">
          <span class="cta-spark" style="top:18%;inset-inline-start:46%" data-icon="sparkle"></span>
          <div><h2 data-i18n="cta_title"></h2><p data-i18n="cta_text"></p></div>
          <a class="btn btn-yellow btn-lg" data-href="shop.html" href="shop.html"><span data-i18n="cta_btn"></span><span class="flip-rtl" data-icon="arrow"></span></a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/live.js" defer></script>
  <script src="assets/js/art.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/pages.js" defer></script>
</body>
</html>
